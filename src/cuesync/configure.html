<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configure CueSync</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #14141c; color: #eee; }
  main { max-width: 32rem; margin: 0 auto; }
  h1 { margin-top: 0; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  small { display: block; font-weight: 400; color: #aaa; }
  input, select, button { box-sizing: border-box; width: 100%; padding: 0.6rem; margin-top: 0.3rem;
    font: inherit; border-radius: 0.4rem; border: 1px solid #555; background: #1f1f2b; color: inherit; }
  button, .install { cursor: pointer; background: #6a4cff; border-color: #6a4cff; }
  .install { display: block; margin-top: 0.6rem; padding: 0.6rem; text-align: center; color: #fff;
    border-radius: 0.4rem; text-decoration: none; }
  #result { margin-top: 1.5rem; }
  #result[hidden] { display: none; }
  .warn { color: #ffb86b; }
  .error { color: #ff7b7b; }
</style>
</head>
<body>
<main data-base-url="{{BASE_URL}}">
<h1>Configure CueSync</h1>
<form id="form">
  <label>SubDL API key
    <input name="subdl_api_key" type="password" required autocomplete="off">
  </label>
  <label>Real-Debrid API key
    <small>Optional. Needed to re-time the subtitles to your file.</small>
    <input name="debrid_api_key" type="password" autocomplete="off">
  </label>
  <button type="submit">Create install link</button>
</form>
<p id="error" class="error" role="alert"></p>
<section id="result" hidden>
  <p class="warn">This link contains your API keys. Keep it private and do not share it.</p>
  <label>Manifest URL
    <input id="manifest-url" type="text" readonly>
  </label>
  <button type="button" id="copy">Copy</button>
  <a id="install" class="install" href="#">Install in Stremio</a>
</section>
</main>
<script>
(function () {
  var base = document.querySelector("main").dataset.baseUrl;
  var form = document.getElementById("form");
  var fields = ["subdl_api_key", "debrid_api_key"];

  function toBase64Url(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    bytes.forEach(function (b) { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function fromBase64Url(token) {
    var b64 = token.replace(/-/g, "+").replace(/_/g, "/");
    b64 += "=".repeat((4 - (b64.length % 4)) % 4);
    var binary = atob(b64);
    var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function readForm() {
    var cfg = {};
    fields.forEach(function (name) {
      var value = form.elements[name].value.trim();
      if (value) cfg[name] = value;
    });
    return cfg;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var cfg = readForm();
    var error = document.getElementById("error");
    if (!cfg.subdl_api_key) {
      error.textContent = "Enter your SubDL API key.";
      return;
    }
    error.textContent = "";
    var token = toBase64Url(JSON.stringify(cfg));
    var manifestUrl = base + "/" + token + "/manifest.json";
    var installUrl = "stremio://" + base.replace(/^https?:\/\//, "") + "/" + token + "/manifest.json";
    document.getElementById("manifest-url").value = manifestUrl;
    document.getElementById("install").href = installUrl;
    document.getElementById("result").hidden = false;
  });

  document.getElementById("copy").addEventListener("click", function () {
    var input = document.getElementById("manifest-url");
    input.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(input.value);
    } else {
      document.execCommand("copy");
    }
  });

  var match = location.pathname.match(/^\/([^/]+)\/configure$/);
  if (match) {
    try {
      var saved = fromBase64Url(match[1]);
      fields.forEach(function (name) {
        // A key saved for another debrid service is not a Real-Debrid key.
        if (name === "debrid_api_key" && saved.debrid_provider && saved.debrid_provider !== "realdebrid") return;
        if (typeof saved[name] === "string") form.elements[name].value = saved[name];
      });
    } catch (e) {
      // An unreadable segment leaves the form empty.
    }
  }
})();
</script>
</body>
</html>
