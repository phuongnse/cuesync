<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configure CueSync</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #14141c; color: #eee; }
  main { max-width: 32rem; margin: 0 auto; }
  h1 { margin-top: 0; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  small { display: block; font-weight: 400; color: #aaa; }
  input, select, button { box-sizing: border-box; width: 100%; padding: 0.6rem; margin-top: 0.3rem;
    font: inherit; border-radius: 0.4rem; border: 1px solid #555; background: #1f1f2b; color: inherit; }
  button, .install { cursor: pointer; background: #6a4cff; border-color: #6a4cff; }
  .install { display: block; margin-top: 0.6rem; padding: 0.6rem; text-align: center; color: #fff;
    border-radius: 0.4rem; text-decoration: none; }
  #result { margin-top: 1.5rem; }
  #result[hidden] { display: none; }
  .warn { color: #ffb86b; }
  .error { color: #ff7b7b; }
</style>
</head>
<body>
<main>
<h1>Configure CueSync</h1>
<form id="form">
  <label>Subtitle languages
    <small>Three-letter codes in order of preference, for example <code>vie, eng</code>.</small>
    <input name="languages" type="text" required autocapitalize="none" autocomplete="off" placeholder="vie, eng">
  </label>
  <label>OpenSubtitles API key
    <input name="opensubtitles_api_key" type="password" autocomplete="off">
  </label>
  <label>OpenSubtitles username
    <small>Optional. Give it together with the password.</small>
    <input name="opensubtitles_username" type="text" autocapitalize="none" autocomplete="off">
  </label>
  <label>OpenSubtitles password
    <input name="opensubtitles_password" type="password" autocomplete="off">
  </label>
  <label>SubDL API key
    <input name="subdl_api_key" type="password" autocomplete="off">
  </label>
  <label>Debrid service
    <select name="debrid_provider">
      <option value="">None</option>
      <option value="realdebrid">Real-Debrid</option>
      <option value="torbox">TorBox</option>
    </select>
  </label>
  <label>Debrid API key
    <small>Required when you choose a debrid service.</small>
    <input name="debrid_api_key" type="password" autocomplete="off">
  </label>
  <button type="submit">Create install link</button>
</form>
<p id="error" class="error" role="alert"></p>
<section id="result" hidden>
  <p class="warn">This link contains your API keys. Keep it private and do not share it.</p>
  <label>Manifest URL
    <input id="manifest-url" type="text" readonly>
  </label>
  <button type="button" id="copy">Copy</button>
  <a id="install" class="install" href="#">Install in Stremio</a>
</section>
</main>
<script>
(function () {
  var form = document.getElementById("form");
  var fields = ["languages", "opensubtitles_api_key", "opensubtitles_username",
    "opensubtitles_password", "subdl_api_key", "debrid_provider", "debrid_api_key"];

  function toBase64Url(text) {
    var bytes = new TextEncoder().encode(text);
    var binary = "";
    bytes.forEach(function (b) { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function fromBase64Url(token) {
    var b64 = token.replace(/-/g, "+").replace(/_/g, "/");
    b64 += "=".repeat((4 - (b64.length % 4)) % 4);
    var binary = atob(b64);
    var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function readForm() {
    var cfg = {};
    fields.forEach(function (name) {
      var value = form.elements[name].value.trim();
      if (name === "languages") {
        var languages = value.toLowerCase().split(/[\s,]+/).filter(Boolean);
        if (languages.length) cfg.languages = languages;
      } else if (value) {
        cfg[name] = value;
      }
    });
    return cfg;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var cfg = readForm();
    var error = document.getElementById("error");
    if (!cfg.languages) {
      error.textContent = "Enter at least one language.";
      return;
    }
    error.textContent = "";
    var token = toBase64Url(JSON.stringify(cfg));
    var manifestUrl = location.origin + "/" + token + "/manifest.json";
    var installUrl = "stremio://" + location.host + "/" + token + "/manifest.json";
    document.getElementById("manifest-url").value = manifestUrl;
    document.getElementById("install").href = installUrl;
    document.getElementById("result").hidden = false;
  });

  document.getElementById("copy").addEventListener("click", function () {
    var input = document.getElementById("manifest-url");
    input.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(input.value);
    } else {
      document.execCommand("copy");
    }
  });

  var match = location.pathname.match(/^\/([^/]+)\/configure$/);
  if (match) {
    try {
      var saved = fromBase64Url(match[1]);
      fields.forEach(function (name) {
        var value = saved[name];
        if (name === "languages" && Array.isArray(value)) value = value.join(", ");
        if (typeof value === "string") form.elements[name].value = value;
      });
    } catch (e) {
      // An unreadable segment leaves the form empty.
    }
  }
})();
</script>
</body>
</html>
