# Installed by `nexkit init`. Commands: /nexkit plan, /nexkit go (issues);
# /nexkit fix, /nexkit review (NexKit pull requests). Settings: .nexkit/config.json
name: NexKit

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed] # close_parent_issues
  push:
    branches: [main] # conflicts.auto_resolve: the default branch moved
  schedule:
    - cron: "23 * * * *" # usage_limit.resume, conflicts.auto_resolve
  workflow_dispatch:
    inputs:
      command:
        description: plan, go, fix or review
        required: true
        type: string
      number:
        description: Issue or pull request number
        required: true
        type: string
      note:
        description: Extra instructions for the agent
        required: false
        type: string
      auto:
        description: Set by NexKit for automatic, conflict and resumed rounds
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  nexkit:
    if: >-
      contains(fromJSON('["workflow_dispatch","issues","push","schedule"]'), github.event_name) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/nexkit')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       startsWith(github.event.pull_request.head.ref, 'nexkit/'))
    # One run at a time per issue or pull request. Set on the job, so only commands join.
    # Runs for other events, such as the schedule, form a group per event.
    concurrency:
      group: nexkit-${{ github.event.issue.number || github.event.pull_request.number || inputs.number || github.event_name }}
    uses: phuongnse/nexkit/.github/workflows/pipeline.yml@v4.0.0
    with:
      nexkit_repository: phuongnse/nexkit
      nexkit_ref: v4.0.0
    # The pipeline passes each job only the secrets .nexkit/config.json names for it (its
    # stages' agents, or the push token), so it can read them by those names.
    secrets: inherit
