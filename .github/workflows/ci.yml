name: CI

# A push to any branch runs CI, so hand-made pull requests show its result. NexKit's
# branches are left out: NexKit runs the same scripts as its own checks, and its pushes and
# pull requests use the Actions token, which starts no workflow.
on:
  push:
    branches-ignore: ['nexkit/**']
  # NexKit starts CI on main after it merges, because its merge starts no push workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # NexKit restores this cache before its setup but never saves it; CI on main does.
      # It must match the `cache` entry in .nexkit/config.json: the same paths and key
      # files, in the same order, and before Setup so the key files are as committed.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: nexkit-${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: nexkit-${{ runner.os }}-pip-
      - name: Setup
        run: scripts/setup.sh
      - name: Lint
        run: scripts/lint.sh
      # Tests run even when lint fails, so one run shows all results.
      - name: Test
        if: ${{ !cancelled() }}
        run: scripts/test.sh
